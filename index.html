<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightstick VR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    #ui {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 300;
      background: rgba(0,0,0,0.55);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
    }

    .swatch {
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.0);
      transition: transform 0.12s, border-color 0.12s;
      box-shadow: 0 0 8px 2px var(--c);
    }
    .swatch:hover   { transform: scale(1.22); }
    .swatch.active  { border-color: rgba(255,255,255,0.85); transform: scale(1.15); }

    .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); flex-shrink: 0; }

    .btn {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 5px 13px;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.06em;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: 0.1em;
      pointer-events: none;
      z-index: 300;
      text-align: center;
      text-transform: uppercase;
    }

    #size-wrap { display: flex; align-items: center; gap: 6px; }
    #size-wrap label { font-size: 10px; color: rgba(255,255,255,0.35); letter-spacing: 0.06em; }
    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 54px; height: 3px;
      background: rgba(255,255,255,0.18);
      border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px; height: 11px;
      border-radius: 50%;
      background: #fff;
    }
  </style>
</head>
<body>

<p id="hint">Mantén presionado y mueve para dibujar &nbsp;·&nbsp; Rueda: tamaño</p>

<div id="ui">
  <div class="swatch active" data-idx="0" style="background:#ff1f5e;--c:#ff1f5e"></div>
  <div class="swatch"        data-idx="1" style="background:#00dfff;--c:#00dfff"></div>
  <div class="swatch"        data-idx="2" style="background:#22ff55;--c:#22ff55"></div>
  <div class="swatch"        data-idx="3" style="background:#ffaa00;--c:#ffaa00"></div>
  <div class="swatch"        data-idx="4" style="background:#cc33ff;--c:#cc33ff"></div>
  <div class="swatch"        data-idx="5" style="background:#ffffff;--c:#ffffff"></div>
  <div class="sep"></div>
  <div id="size-wrap">
    <label>TAM</label>
    <input type="range" id="szSlider" min="1" max="10" value="3" step="0.5">
  </div>
  <div class="sep"></div>
  <button class="btn" id="trailBtn">Rastro: ON</button>
  <button class="btn" id="clearBtn">Borrar</button>
</div>

<a-scene id="scene"
  background="color: #000008"
  renderer="antialias:true; colorManagement:true; sortObjects:true"
  vr-mode-ui="enabled:true"
>
  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="cam"
      look-controls="pointerLockEnabled:false; magicWindowTrackingEnabled:true"
      wasd-controls="enabled:false">
    </a-camera>
  </a-entity>
  <a-light type="ambient" color="#000" intensity="0.04"></a-light>
</a-scene>

<script>
// ═══════════════════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN
// ═══════════════════════════════════════════════════════════════════════════════
const COLORS = [
  { r:1.00, g:0.12, b:0.37 },  // rosa
  { r:0.00, g:0.87, b:1.00 },  // cian
  { r:0.13, g:1.00, b:0.33 },  // verde
  { r:1.00, g:0.67, b:0.00 },  // naranja
  { r:0.80, g:0.20, b:1.00 },  // morado
  { r:1.00, g:1.00, b:1.00 },  // blanco
];

const CFG = {
  colorIdx:    0,
  brushRadius: 0.009,   // radio del trazo
  trailLife:   4000,    // ms que dura el rastro
  trailOn:     true,
  minDist:     0.006,   // distancia mínima entre puntos
  camDist:     0.85,    // metros desde la cámara
};

// ═══════════════════════════════════════════════════════════════════════════════
//  SISTEMA PRINCIPAL (arranca cuando A-Frame está listo)
// ═══════════════════════════════════════════════════════════════════════════════
const sceneEl = document.getElementById('scene');
const camEl   = document.getElementById('cam');

sceneEl.addEventListener('loaded', () => {
  const threeScene = sceneEl.object3D;
  const T = THREE;

  // ── Helpers ────────────────────────────────────────────────────────────────
  function colorVec(idx) {
    const c = COLORS[idx];
    return new T.Color(c.r, c.g, c.b);
  }

  // ── Estrellas ──────────────────────────────────────────────────────────────
  {
    const N = 1400;
    const pos = new Float32Array(N * 3);
    const col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r     = 65 + Math.random() * 55;
      const theta = Math.random() * Math.PI * 2;
      const phi   = Math.acos(2 * Math.random() - 1);
      pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = r * Math.cos(phi);
      const b = 0.35 + Math.random() * 0.65;
      const warm = Math.random();
      col[i*3]   = b * (0.85 + warm * 0.15);
      col[i*3+1] = b * (0.85 + warm * 0.05);
      col[i*3+2] = b * (0.90 + (1-warm) * 0.10);
    }
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    geo.setAttribute('color',    new T.BufferAttribute(col, 3));
    const mat = new T.PointsMaterial({
      size: 0.10, vertexColors: true,
      blending: T.AdditiveBlending, depthWrite: false,
      transparent: true, opacity: 0.9, sizeAttenuation: true,
    });
    threeScene.add(new T.Points(geo, mat));
  }

  // ── Barrita de neón ────────────────────────────────────────────────────────
  const stickGroup = new T.Group();
  threeScene.add(stickGroup);

  // materiales (se actualizan al cambiar color)
  const tubeMat = new T.MeshBasicMaterial({
    color: colorVec(0),
    blending: T.AdditiveBlending, depthWrite: false,
  });
  const haloMat = new T.MeshBasicMaterial({
    color: colorVec(0), transparent: true, opacity: 0.10,
    blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide,
  });
  const tipMat = new T.MeshBasicMaterial({
    color: colorVec(0),
    blending: T.AdditiveBlending, depthWrite: false,
  });
  const tipGlowMat = new T.MeshBasicMaterial({
    color: colorVec(0), transparent: true, opacity: 0.07,
    blending: T.AdditiveBlending, depthWrite: false,
  });
  const emberMat = new T.MeshBasicMaterial({
    color: new T.Color(1, 1, 1),  // siempre blanca brillante (como incandescente)
    blending: T.AdditiveBlending, depthWrite: false,
  });

  // Tubo
  const tubeMesh = new T.Mesh(new T.CylinderGeometry(0.006, 0.006, 0.44, 8), tubeMat);
  tubeMesh.rotation.x = Math.PI / 2;
  stickGroup.add(tubeMesh);

  // Halo exterior del tubo
  const haloMesh = new T.Mesh(new T.CylinderGeometry(0.020, 0.020, 0.45, 8), haloMat);
  haloMesh.rotation.x = Math.PI / 2;
  stickGroup.add(haloMesh);

  // Punta brillante (punto de mayor temperatura: casi blanca)
  const TIP_Z = -0.222;
  const tipMesh = new T.Mesh(new T.SphereGeometry(0.013, 10, 7), tipMat);
  tipMesh.position.z = TIP_Z;
  stickGroup.add(tipMesh);

  // Núcleo incandescente (punto blanco caliente)
  const emberMesh = new T.Mesh(new T.SphereGeometry(0.007, 8, 6), emberMat);
  emberMesh.position.z = TIP_Z;
  stickGroup.add(emberMesh);

  // Halo grande de la punta
  const tipGlowMesh = new T.Mesh(new T.SphereGeometry(0.048, 10, 7), tipGlowMat);
  tipGlowMesh.position.z = TIP_Z;
  stickGroup.add(tipGlowMesh);

  // Halo medio de la punta
  const tipMidGlowMat = new T.MeshBasicMaterial({
    color: colorVec(0), transparent: true, opacity: 0.18,
    blending: T.AdditiveBlending, depthWrite: false,
  });
  const tipMidGlowMesh = new T.Mesh(new T.SphereGeometry(0.024, 10, 7), tipMidGlowMat);
  tipMidGlowMesh.position.z = TIP_Z;
  stickGroup.add(tipMidGlowMesh);

  function setColor(idx) {
    const c = colorVec(idx);
    tubeMat.color.copy(c);
    haloMat.color.copy(c);
    tipMat.color.copy(c);
    tipGlowMat.color.copy(c);
    tipMidGlowMat.color.copy(c);
    // ember siempre blanca
  }

  // ── Rastro: pool de segmentos de línea ─────────────────────────────────────
  //   Cada segmento = una THREE.Line de 2 puntos con blending aditivo
  //   Al expirar vuelve al pool (invisible) para reutilizarse

  const linePool   = [];
  const activeSegs = []; // { line, born, life, col }

  function makePoolLine() {
    const geo = new T.BufferGeometry();
    geo.setAttribute('position', new T.BufferAttribute(new Float32Array(6), 3));
    const mat = new T.LineBasicMaterial({
      blending: T.AdditiveBlending, depthWrite: false,
      transparent: true, opacity: 1, vertexColors: false,
    });
    const ln = new T.Line(geo, mat);
    ln.frustumCulled = false;
    threeScene.add(ln);
    return ln;
  }

  function getLine() {
    return linePool.length ? linePool.pop() : makePoolLine();
  }

  function recycleLine(ln) {
    ln.visible = false;
    linePool.push(ln);
  }

  function addSegment(p1, p2, colIdx) {
    if (!CFG.trailOn) return;
    const ln  = getLine();
    const arr = ln.geometry.attributes.position.array;
    arr[0] = p1.x; arr[1] = p1.y; arr[2] = p1.z;
    arr[3] = p2.x; arr[4] = p2.y; arr[5] = p2.z;
    ln.geometry.attributes.position.needsUpdate = true;
    ln.geometry.computeBoundingSphere();
    const c = COLORS[colIdx];
    ln.material.color.setRGB(c.r, c.g, c.b);
    ln.material.opacity = 1;
    ln.visible = true;
    activeSegs.push({ line: ln, born: performance.now(), life: CFG.trailLife });
  }

  // ── Chispas / partículas de la punta ───────────────────────────────────────
  const SPARK_N  = 160;
  const sparkBuf = {
    pos: new Float32Array(SPARK_N * 3),
    col: new Float32Array(SPARK_N * 3),
  };
  const sparkGeo = new T.BufferGeometry();
  sparkGeo.setAttribute('position', new T.BufferAttribute(sparkBuf.pos, 3));
  sparkGeo.setAttribute('color',    new T.BufferAttribute(sparkBuf.col, 3));
  const sparkMat = new T.PointsMaterial({
    size: 0.022, vertexColors: true,
    blending: T.AdditiveBlending, depthWrite: false,
    transparent: true, sizeAttenuation: true,
  });
  threeScene.add(new T.Points(sparkGeo, sparkMat));

  const sparkData = Array.from({ length: SPARK_N }, () => ({
    active: false,
    pos: new T.Vector3(),
    vel: new T.Vector3(),
    born: 0, life: 0,
    col: COLORS[0],
  }));

  function emitSpark(origin, colIdx) {
    const s = sparkData.find(d => !d.active);
    if (!s) return;
    s.active = true;
    s.pos.copy(origin);
    const sp = 0.015 + Math.random() * 0.025;
    s.vel.set(
      (Math.random() - 0.5) * sp,
      (Math.random() - 0.5) * sp,
      (Math.random() - 0.5) * sp,
    );
    s.born = performance.now();
    s.life = 250 + Math.random() * 600;
    s.col  = COLORS[colIdx];
  }

  // ── Posicionamiento del stick en modo escritorio/móvil ─────────────────────
  const _camPos  = new T.Vector3();
  const _camQuat = new T.Quaternion();
  const _dir     = new T.Vector3();
  const tipWorld = new T.Vector3(); // posición mundial de la punta (se actualiza cada frame)

  function positionStickFromNDC(nx, ny) {
    const co = camEl.object3D;
    co.getWorldPosition(_camPos);
    co.getWorldQuaternion(_camQuat);

    const fovRad = camEl.components.camera.data.fov * (Math.PI / 180);
    const halfH  = Math.tan(fovRad * 0.5);
    const halfW  = halfH * (window.innerWidth / window.innerHeight);

    _dir.set(nx * halfW, ny * halfH, -1).normalize().applyQuaternion(_camQuat);

    stickGroup.position.copy(_camPos).addScaledVector(_dir, CFG.camDist);
    stickGroup.quaternion.copy(_camQuat);

    // Punta en world space
    tipWorld.set(0, 0, TIP_Z)
      .applyQuaternion(_camQuat)
      .add(stickGroup.position);
  }

  // ── Lógica de dibujo ───────────────────────────────────────────────────────
  let drawing = false;
  let lastPt  = null;

  function onDraw() {
    if (!drawing) return;
    if (!lastPt) { lastPt = tipWorld.clone(); return; }
    const d = tipWorld.distanceTo(lastPt);
    if (d < CFG.minDist) return;
    addSegment(lastPt, tipWorld, CFG.colorIdx);
    if (Math.random() < 0.35) emitSpark(tipWorld, CFG.colorIdx);
    lastPt.copy(tipWorld);
  }

  // ── Tick principal (registrado como componente A-Frame) ────────────────────
  AFRAME.registerComponent('neon-system', {
    tick(time, dt) {
      const now = performance.now();
      const t   = now * 0.001;

      // Pulso de la punta
      const pulse = 1 + 0.18 * Math.sin(t * 2.8);
      tipGlowMesh.scale.setScalar(pulse);
      tipMidGlowMesh.scale.setScalar(0.9 + 0.1 * Math.sin(t * 3.5));

      // Fade de segmentos de rastro
      for (let i = activeSegs.length - 1; i >= 0; i--) {
        const s   = activeSegs[i];
        const age = now - s.born;
        if (age >= s.life) { recycleLine(s.line); activeSegs.splice(i, 1); continue; }
        // fade: rápido al inicio para dar sensación de calor que se enfría,
        //       pero mantiene algo de brillo antes de desaparecer
        const progress = age / s.life;
        const opacity  = Math.pow(1 - progress, 0.7);
        s.line.material.opacity = opacity;
      }

      // Chispas
      for (let i = 0; i < SPARK_N; i++) {
        const s = sparkData[i];
        if (!s.active) {
          sparkBuf.pos[i*3+1] = -9999; // ocultar
          continue;
        }
        const age = now - s.born;
        if (age > s.life) { s.active = false; sparkBuf.pos[i*3+1] = -9999; continue; }
        s.vel.y -= 0.000018 * dt;
        s.pos.addScaledVector(s.vel, dt);
        sparkBuf.pos[i*3]   = s.pos.x;
        sparkBuf.pos[i*3+1] = s.pos.y;
        sparkBuf.pos[i*3+2] = s.pos.z;
        const tf = Math.pow(1 - age / s.life, 0.6);
        sparkBuf.col[i*3]   = s.col.r * tf;
        sparkBuf.col[i*3+1] = s.col.g * tf;
        sparkBuf.col[i*3+2] = s.col.b * tf;
      }
      sparkGeo.attributes.position.needsUpdate = true;
      sparkGeo.attributes.color.needsUpdate    = true;

      // Emitir chispas pasivas mientras se dibuja
      if (drawing && CFG.trailOn && Math.random() < 0.25) {
        emitSpark(tipWorld, CFG.colorIdx);
      }
    },
  });

  sceneEl.setAttribute('neon-system', '');

  // ── Controladores VR ───────────────────────────────────────────────────────
  AFRAME.registerComponent('neon-hand', {
    schema: { hand: { default: 'right' } },
    init() {
      this.vrLastPt   = null;
      this.vrDrawing  = false;
      this.localTip   = new T.Vector3(0, 0, -0.05);

      this.el.addEventListener('triggerdown', () => { this.vrDrawing = true;  this.vrLastPt = null; });
      this.el.addEventListener('triggerup',   () => { this.vrDrawing = false; this.vrLastPt = null; });
      this.el.addEventListener('bbuttondown', clearTrails);
      this.el.addEventListener('ybuttondown', clearTrails);

      this.el.addEventListener('thumbstickmoved', e => {
        const { x, y } = e.detail;
        if (Math.hypot(x, y) < 0.65) return;
        const angle = Math.atan2(y, x);
        const idx   = ((Math.floor(((angle + Math.PI) / (Math.PI * 2)) * COLORS.length)) % COLORS.length + COLORS.length) % COLORS.length;
        changeColor(idx);
      });
    },
    tick() {
      const obj = this.el.object3D;
      const tip = this.localTip.clone().applyQuaternion(obj.quaternion).add(obj.position);

      stickGroup.position.copy(obj.position);
      stickGroup.quaternion.copy(obj.quaternion);
      tipWorld.copy(tip);

      if (!this.vrDrawing) return;
      if (!this.vrLastPt) { this.vrLastPt = tip.clone(); return; }
      const d = tip.distanceTo(this.vrLastPt);
      if (d < CFG.minDist) return;
      addSegment(this.vrLastPt, tip, CFG.colorIdx);
      if (Math.random() < 0.4) emitSpark(tip, CFG.colorIdx);
      this.vrLastPt.copy(tip);
    },
  });

  sceneEl.addEventListener('enter-vr', () => {
    document.getElementById('ui').style.display   = 'none';
    document.getElementById('hint').style.display = 'none';
    const h = document.createElement('a-entity');
    h.setAttribute('oculus-touch-controls', 'hand: right');
    h.setAttribute('neon-hand', 'hand: right');
    h.id = 'vr-hand';
    sceneEl.appendChild(h);
  });

  sceneEl.addEventListener('exit-vr', () => {
    document.getElementById('ui').style.display   = '';
    document.getElementById('hint').style.display = '';
    const h = document.getElementById('vr-hand');
    if (h) h.remove();
  });

  // ── Eventos de escritorio / móvil ─────────────────────────────────────────
  function ndcFromClient(cx, cy) {
    return [
       (cx / window.innerWidth)  * 2 - 1,
      -(cy / window.innerHeight) * 2 + 1,
    ];
  }

  window.addEventListener('mousemove', e => {
    positionStickFromNDC(...ndcFromClient(e.clientX, e.clientY));
    onDraw();
  });
  window.addEventListener('mousedown', e => {
    if (e.target.closest('#ui')) return;
    drawing = true; lastPt = null;
  });
  window.addEventListener('mouseup', () => { drawing = false; lastPt = null; });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    positionStickFromNDC(...ndcFromClient(t.clientX, t.clientY));
    onDraw();
  }, { passive: false });
  window.addEventListener('touchstart', e => {
    if (e.target.closest('#ui')) return;
    drawing = true; lastPt = null;
  }, { passive: true });
  window.addEventListener('touchend', () => { drawing = false; lastPt = null; });

  window.addEventListener('wheel', e => {
    CFG.brushRadius = Math.max(0.003, Math.min(0.045, CFG.brushRadius - e.deltaY * 0.00003));
    document.getElementById('szSlider').value = CFG.brushRadius * 1000 / 4.5;
  }, { passive: true });

  // Posición inicial
  positionStickFromNDC(0, 0);

  // ── Funciones globales de control ─────────────────────────────────────────
  function clearTrails() {
    for (let i = activeSegs.length - 1; i >= 0; i--) {
      recycleLine(activeSegs[i].line);
    }
    activeSegs.length = 0;
  }

  function changeColor(idx) {
    CFG.colorIdx = idx;
    setColor(idx);
    document.querySelectorAll('.swatch').forEach((s, i) => {
      s.classList.toggle('active', i === idx);
    });
  }

  // ── Conectar UI ───────────────────────────────────────────────────────────
  document.querySelectorAll('.swatch').forEach((s, i) => {
    s.addEventListener('click', () => changeColor(i));
  });

  document.getElementById('clearBtn').addEventListener('click', clearTrails);

  document.getElementById('trailBtn').addEventListener('click', function() {
    CFG.trailOn = !CFG.trailOn;
    this.textContent = 'Rastro: ' + (CFG.trailOn ? 'ON' : 'OFF');
    if (!CFG.trailOn) clearTrails();
  });

  document.getElementById('szSlider').addEventListener('input', function() {
    CFG.brushRadius = this.value * 4.5 / 1000;
  });
});
</script>
</body>
</html>
