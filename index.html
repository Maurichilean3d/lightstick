<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lightstick VR – Dibuja en la oscuridad</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }

    #ui {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
      align-items: center;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      box-shadow: 0 0 12px currentColor;
    }
    .color-btn:hover, .color-btn.active {
      transform: scale(1.25);
      border-color: white;
    }

    #clear-btn {
      padding: 8px 18px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }
    #clear-btn:hover { background: rgba(255,255,255,0.18); }

    #hint {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.45);
      font-family: sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      pointer-events: none;
    }

    #vr-btn {
      position: fixed;
      bottom: 70px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="hint">Mantén clic y mueve para dibujar · Rueda del ratón para el tamaño</div>

<div id="ui">
  <div class="color-btn active" data-color="#ff2d78" style="background:#ff2d78; color:#ff2d78;"></div>
  <div class="color-btn" data-color="#00eeff" style="background:#00eeff; color:#00eeff;"></div>
  <div class="color-btn" data-color="#39ff14" style="background:#39ff14; color:#39ff14;"></div>
  <div class="color-btn" data-color="#ff9900" style="background:#ff9900; color:#ff9900;"></div>
  <div class="color-btn" data-color="#bf00ff" style="background:#bf00ff; color:#bf00ff;"></div>
  <div class="color-btn" data-color="#ffffff" style="background:#fff; color:#fff;"></div>
  <button id="clear-btn">Borrar todo</button>
</div>

<a-scene
  id="scene"
  background="color: #000000"
  renderer="antialias: true; colorManagement: true"
  vr-mode-ui="enabled: true"
>
  <!-- Cámara con controles de escritorio y móvil -->
  <a-entity id="rig" position="0 1.6 0">
    <a-camera
      id="cam"
      look-controls="pointerLockEnabled: false"
      wasd-controls="enabled: false"
    ></a-camera>
  </a-entity>

  <!-- Partículas de ambiente (estrellas de fondo) -->
  <a-entity id="stars"></a-entity>

  <!-- Contenedor de trazos -->
  <a-entity id="strokes"></a-entity>

  <!-- Luz de ambiente mínima para que la escena sea casi negra -->
  <a-light type="ambient" color="#111" intensity="0.3"></a-light>
</a-scene>

<script>
// ─── Estado global ────────────────────────────────────────────────────────────
const state = {
  color: '#ff2d78',
  drawing: false,
  brushSize: 0.012,
  lastPoint: null,
  minDist: 0.008,   // distancia mínima entre puntos del trazo
};

const scene   = document.getElementById('scene');
const cam     = document.getElementById('cam');
const strokes = document.getElementById('strokes');

// ─── Estrellas de fondo ───────────────────────────────────────────────────────
function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 600; i++) {
    const star = document.createElement('a-sphere');
    const r = 80 + Math.random() * 40;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    star.setAttribute('position', {
      x: r * Math.sin(phi) * Math.cos(theta),
      y: r * Math.sin(phi) * Math.sin(theta),
      z: r * Math.cos(phi),
    });
    const s = 0.04 + Math.random() * 0.12;
    star.setAttribute('radius', s);
    const bright = Math.round(120 + Math.random() * 135);
    star.setAttribute('color', `rgb(${bright},${bright},${bright})`);
    star.setAttribute('material', 'emissive: white; emissiveIntensity: 0.6; shader: flat');
    container.appendChild(star);
  }
}
createStars();

// ─── Barrita de neón (cursor 3D) ──────────────────────────────────────────────
const stick = document.createElement('a-entity');

// cuerpo del tubo
const tube = document.createElement('a-cylinder');
tube.setAttribute('radius', '0.018');
tube.setAttribute('height', '0.55');
tube.setAttribute('rotation', '90 0 0');
tube.setAttribute('position', '0 0 0');
tube.id = 'stick-tube';
stick.appendChild(tube);

// halo brillante externo
const glow = document.createElement('a-cylinder');
glow.setAttribute('radius', '0.038');
glow.setAttribute('height', '0.56');
glow.setAttribute('rotation', '90 0 0');
glow.setAttribute('position', '0 0 0');
glow.setAttribute('material', 'opacity: 0.18; transparent: true; side: double; depthWrite: false; shader: flat');
glow.id = 'stick-glow';
stick.appendChild(glow);

// punta emisora de luz
const tip = document.createElement('a-sphere');
tip.setAttribute('radius', '0.022');
tip.setAttribute('position', '0 0 -0.278');
tip.id = 'stick-tip';
stick.appendChild(tip);

// luz puntual que emana del stick
const light = document.createElement('a-light');
light.setAttribute('type', 'point');
light.setAttribute('intensity', '1.8');
light.setAttribute('distance', '2.2');
light.setAttribute('decay', '2');
light.id = 'stick-light';
stick.appendChild(light);

scene.appendChild(stick);

function updateStickColor(hex) {
  tube.setAttribute('material', `color: ${hex}; emissive: ${hex}; emissiveIntensity: 1.2; shader: flat`);
  glow.setAttribute('material', `color: ${hex}; emissive: ${hex}; emissiveIntensity: 0.9; opacity: 0.18; transparent: true; side: double; depthWrite: false; shader: flat`);
  tip.setAttribute('material', `color: ${hex}; emissive: ${hex}; emissiveIntensity: 2; shader: flat`);
  light.setAttribute('color', hex);
}
updateStickColor(state.color);

// ─── Proyección del cursor en el espacio 3D ───────────────────────────────────
const _v3      = new THREE.Vector3();
const _quat    = new THREE.Quaternion();
const _dir     = new THREE.Vector3();
const DIST     = 0.9; // metros frente a la cámara

function getStickWorldPos(nx, ny) {
  // nx, ny en [-1, 1] normalizados
  const camEl  = cam;
  const camObj = camEl.object3D;

  camObj.getWorldPosition(_v3);
  camObj.getWorldQuaternion(_quat);

  // dirección al punto de pantalla
  const fov    = camEl.components.camera.data.fov * (Math.PI / 180);
  const aspect = window.innerWidth / window.innerHeight;
  const halfH  = Math.tan(fov / 2);
  const halfW  = halfH * aspect;

  _dir.set(nx * halfW, ny * halfH, -1).normalize();
  _dir.applyQuaternion(_quat);

  return new THREE.Vector3().addVectors(_v3, _dir.multiplyScalar(DIST));
}

function moveStick(nx, ny) {
  const pos = getStickWorldPos(nx, ny);

  const camObj = cam.object3D;
  camObj.getWorldQuaternion(_quat);

  stick.object3D.position.copy(pos);
  stick.object3D.quaternion.copy(_quat);
}

// ─── Dibujo de trazos ─────────────────────────────────────────────────────────
function hexToVec3(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return new THREE.Color(r, g, b);
}

function addSegment(p1, p2) {
  const dir  = new THREE.Vector3().subVectors(p2, p1);
  const len  = dir.length();
  if (len < 0.001) return;

  const mid  = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

  const seg  = document.createElement('a-cylinder');
  seg.setAttribute('radius', state.brushSize);
  seg.setAttribute('height', len);
  seg.setAttribute('position', `${mid.x} ${mid.y} ${mid.z}`);

  // orientar el cilindro de p1 a p2
  const up   = new THREE.Vector3(0, 1, 0);
  const q    = new THREE.Quaternion().setFromUnitVectors(up, dir.normalize());
  const e    = new THREE.Euler().setFromQuaternion(q, 'XYZ');
  seg.setAttribute('rotation', `${THREE.MathUtils.radToDeg(e.x)} ${THREE.MathUtils.radToDeg(e.y)} ${THREE.MathUtils.radToDeg(e.z)}`);

  const c = state.color;
  seg.setAttribute('material', `color: ${c}; emissive: ${c}; emissiveIntensity: 1.4; shader: flat`);

  strokes.appendChild(seg);

  // halo del trazo
  const halo = document.createElement('a-cylinder');
  halo.setAttribute('radius', state.brushSize * 2.6);
  halo.setAttribute('height', len);
  halo.setAttribute('position', `${mid.x} ${mid.y} ${mid.z}`);
  halo.setAttribute('rotation', `${THREE.MathUtils.radToDeg(e.x)} ${THREE.MathUtils.radToDeg(e.y)} ${THREE.MathUtils.radToDeg(e.z)}`);
  halo.setAttribute('material', `color: ${c}; emissive: ${c}; emissiveIntensity: 0.7; opacity: 0.22; transparent: true; side: double; depthWrite: false; shader: flat`);
  strokes.appendChild(halo);
}

// ─── Eventos de ratón / touch ─────────────────────────────────────────────────
function normCoords(clientX, clientY) {
  return {
    nx:  (clientX / window.innerWidth)  * 2 - 1,
    ny: -(clientY / window.innerHeight) * 2 + 1,
  };
}

window.addEventListener('mousemove', e => {
  const { nx, ny } = normCoords(e.clientX, e.clientY);
  moveStick(nx, ny);

  if (state.drawing) {
    const pos = getStickWorldPos(nx, ny);
    if (state.lastPoint) {
      const d = pos.distanceTo(state.lastPoint);
      if (d >= state.minDist) {
        addSegment(state.lastPoint, pos);
        state.lastPoint = pos.clone();
      }
    } else {
      state.lastPoint = pos.clone();
    }
  }
});

window.addEventListener('mousedown', e => {
  if (e.target.closest('#ui')) return;
  state.drawing   = true;
  state.lastPoint = null;
});

window.addEventListener('mouseup', () => {
  state.drawing   = false;
  state.lastPoint = null;
});

// Touch
window.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  const { nx, ny } = normCoords(t.clientX, t.clientY);
  moveStick(nx, ny);
  if (state.drawing) {
    const pos = getStickWorldPos(nx, ny);
    if (state.lastPoint && pos.distanceTo(state.lastPoint) >= state.minDist) {
      addSegment(state.lastPoint, pos);
      state.lastPoint = pos.clone();
    } else if (!state.lastPoint) {
      state.lastPoint = pos.clone();
    }
  }
}, { passive: false });

window.addEventListener('touchstart', e => {
  if (e.target.closest('#ui')) return;
  state.drawing   = true;
  state.lastPoint = null;
}, { passive: true });

window.addEventListener('touchend', () => {
  state.drawing   = false;
  state.lastPoint = null;
});

// Rueda del ratón → tamaño del pincel
window.addEventListener('wheel', e => {
  state.brushSize = Math.max(0.004, Math.min(0.06, state.brushSize - e.deltaY * 0.00005));
});

// ─── UI: colores y borrar ────────────────────────────────────────────────────
document.querySelectorAll('.color-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.color = btn.dataset.color;
    updateStickColor(state.color);
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  while (strokes.firstChild) strokes.removeChild(strokes.firstChild);
});

// ─── Controladores VR (mano derecha) ─────────────────────────────────────────
scene.addEventListener('enter-vr', () => {
  document.getElementById('hint').style.display = 'none';
  document.getElementById('ui').style.display   = 'none';

  const rightHand = document.createElement('a-entity');
  rightHand.setAttribute('oculus-touch-controls', 'hand: right');
  rightHand.setAttribute('id', 'right-hand');
  rightHand.setAttribute('vr-draw', '');
  scene.appendChild(rightHand);

  const leftHand = document.createElement('a-entity');
  leftHand.setAttribute('oculus-touch-controls', 'hand: left');
  leftHand.setAttribute('id', 'left-hand');
  scene.appendChild(leftHand);
});

scene.addEventListener('exit-vr', () => {
  document.getElementById('hint').style.display = '';
  document.getElementById('ui').style.display   = '';
  const rh = document.getElementById('right-hand');
  const lh = document.getElementById('left-hand');
  if (rh) rh.parentNode.removeChild(rh);
  if (lh) lh.parentNode.removeChild(lh);
});

// Componente de dibujo VR con controlador
AFRAME.registerComponent('vr-draw', {
  init() {
    this.drawing    = false;
    this.lastPoint  = null;
    this.tipOffset  = new THREE.Vector3(0, 0, -0.28);

    this.el.addEventListener('triggerdown', () => {
      this.drawing   = true;
      this.lastPoint = null;
    });
    this.el.addEventListener('triggerup', () => {
      this.drawing   = false;
      this.lastPoint = null;
    });

    // Botones de color en VR con thumbstick
    this.el.addEventListener('thumbstickmoved', e => {
      const colors = ['#ff2d78','#00eeff','#39ff14','#ff9900','#bf00ff','#ffffff'];
      const angle  = Math.atan2(e.detail.y, e.detail.x);
      const idx    = Math.round(((angle + Math.PI) / (Math.PI * 2)) * colors.length) % colors.length;
      if (Math.hypot(e.detail.x, e.detail.y) > 0.7) {
        state.color = colors[idx];
        updateStickColor(state.color);
      }
    });

    // Botón B / Y → borrar
    this.el.addEventListener('bbuttondown', () => {
      while (strokes.firstChild) strokes.removeChild(strokes.firstChild);
    });
  },

  tick() {
    const obj = this.el.object3D;

    // Mover el stick a la posición del controlador
    const tip = this.tipOffset.clone().applyQuaternion(obj.quaternion).add(obj.position);
    stick.object3D.position.copy(obj.position);
    stick.object3D.quaternion.copy(obj.quaternion);

    if (this.drawing) {
      if (this.lastPoint && tip.distanceTo(this.lastPoint) >= state.minDist) {
        addSegment(this.lastPoint, tip);
        this.lastPoint = tip.clone();
      } else if (!this.lastPoint) {
        this.lastPoint = tip.clone();
      }
    }
  },
});

// ─── Animación del stick (respiración / pulso) ───────────────────────────────
let t = 0;
function animateStick() {
  requestAnimationFrame(animateStick);
  t += 0.04;
  const pulse = 1 + 0.12 * Math.sin(t * 2.5);
  light.setAttribute('intensity', 1.8 * pulse);
}
animateStick();
</script>
</body>
</html>
